<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback - FoodMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-blue-400 text-white p-4 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">FoodMart</h1>
      <a href="/" class="hover:text-gray-200">Home</a>
    </div>
  </nav>

  <!-- Main Feedback Section -->
  <main class="container mx-auto mt-10 p-6 bg-white shadow-xl rounded-xl w-full max-w-2xl">
    <h2 class="text-3xl font-bold text-center text-blue-700 mb-2">📝 Share Your Feedback</h2>
    <p class="text-center text-gray-600 mb-6">We appreciate your input and use it to improve our services.</p>

    <!-- Success Message -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="bg-green-100 text-green-700 border border-green-400 px-4 py-3 rounded">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" action="{% url 'submit_feedback' %}" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-gray-700 font-medium">Name</label>
        <input type="text" name="name" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Email</label>
        <input type="email" name="email" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Message</label>
        <textarea name="message" rows="4" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Rating</label>
        <select name="rating" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
          <option value="">Select a rating</option>
          <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
          <option value="4">⭐⭐⭐⭐ - Good</option>
          <option value="3">⭐⭐⭐ - Average</option>
          <option value="2">⭐⭐ - Poor</option>
          <option value="1">⭐ - Very Poor</option>
        </select>
      </div>

      <button type="submit" class="bg-blue-500 text-white font-semibold py-2 px-6 rounded hover:bg-blue-600 w-full">
        Submit Feedback
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-blue-400 text-white text-center p-4 mt-10">
    <p>&copy; 2025 FoodMart. All rights reserved.</p>
  </footer>

</body>
</html>
