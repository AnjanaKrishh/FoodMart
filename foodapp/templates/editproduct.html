<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-6 py-10" style="font-family: 'Segoe UI', sans-serif;">

    <div class="bg-white w-full max-w-2xl rounded-lg shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Edit Product</h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                <input type="text" name="name" id="name" value="{{ c.name }}" required
                    class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" id="description" rows="3" required
                    class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ c.description }}</textarea>
            </div>

            <!-- Quantity -->
            <div>
                <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                <input type="number" name="quantity" id="quantity" value="{{ c.quantity }}" required min="0"
                    class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Price -->
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                <input type="number" name="price" id="price" value="{{ c.price }}" required min="0"
                    class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Current Image Preview -->
            {% if c.image %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Image</label>
                <img src="{{ c.image.url }}" alt="Product Image" class="h-32 w-32 object-cover rounded mb-2">
            </div>
            {% endif %}

            <!-- Upload New Image -->
            <div>
                <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Upload New Image</label>
                <input type="file" name="image" id="image"
                    class="w-full border border-gray-300 rounded px-4 py-2 file:bg-blue-100 file:border-none file:px-4 file:py-2 file:rounded file:text-blue-700 hover:file:bg-blue-200" />
            </div>

            <!-- Buttons -->
            <div class="flex justify-between items-center pt-4">
                <a href="{% url 'productlist' %}" 
                   class="bg-gray-500 hover:bg-gray-600 text-white text-sm px-4 py-2 rounded">
                    Cancel
                </a>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-6 py-2 rounded">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</body>
</html>
