<!DOCTYPE html>
<html>
<head>
    <title>Admin - User List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(194, 39, 39);
            padding: 20px;
        }
        h1 {
            color: #fff;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(185, 28, 28, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }
        .delete-btn {
            padding: 6px 12px;
            color: white;
            background-color: red;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        .delete-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <h1>Admin - User List</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for i in u %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.age }}</td>
                <td>{{ i.email }}</td>
                <td>
                    {% if i.image %}
                        <img src="{{ i.image.url }}" alt="User Image">
                    {% else %}
                        No Image
                    {% endif %}
                </td>
                <td>
                    <a href="{% url 'deleteuser' i.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
