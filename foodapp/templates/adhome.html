<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Seller Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #343a40;
            padding: 15px 20px;
            color: white;
            text-align: center;
            font-size: 24px;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .dashboard-title {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .dashboard-button {
            padding: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .dashboard-button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 600px) {
            .dashboard-title {
                font-size: 22px;
            }

            .dashboard-button {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        Seller Dashboard
    </div>

    <div class="dashboard-container">
        <div class="dashboard-title">Welcome, Seller</div>

        <div class="button-grid">
            <a href="/userlist/" class="dashboard-button">Manage Users</a>
            <a href="/productlist/" class="dashboard-button">Manage Products</a>
            <a href="#" class="dashboard-button">Site Settings</a>
            <a href="#" class="dashboard-button">Change Password</a>
            <a href="/logout/" class="dashboard-button">Logout</a>
        </div>
    </div>

</body>
</html>
