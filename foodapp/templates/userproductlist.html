<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f0fa; /* pastel blue */
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }

        .product-price {
            color: #27ae60;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .product-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .add-to-cart {
            background-color: #3498db;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        .add-to-cart:hover {
            background-color: #217dbb;
        }
    </style>
</head>
<body>
    <h1>🛍️ Our Products</h1>

    <div class="container">
        {% for product in a %}
        <div class="card">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-img">
            <div class="product-title">{{ product.name }}</div>
            <div class="product-price">${{ product.price }}</div>
            <div class="product-description">{{ product.description }}</div>
            <a href="{% url 'addcart' product.id %}" class="add-to-cart">
                ➕ Add to Cart
            </a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
